<!doctype html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Alla användare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Alla användare</h1>
<a th:href="@{/tickets}">Tillbaka till ärenden</a>
<a th:href="@{/admin/users/new}">Lägg till användare</a>
<table>
    <thead>
    <tr>
        <th>Användarnamn</th>
        <th>Roll</th>
        <th>Aktiv</th>
        <th>Åtgärder</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.username}">användarnamn</td>
        <td th:text="${user.role}">roll</td>
        <td th:text="${user.active ? 'Aktiv' : 'Inaktiv'}">status</td>
        <td>
            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}">Redigera</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
